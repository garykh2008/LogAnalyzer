name: Release

# Package the Tauri app and publish a GitHub Release with the installers.
# Tag push is the trigger; tags are matched case-sensitively so the legacy
# uppercase `LOG_ANALYZER_V2.x` tags never fire this workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v3.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # src-tauri is a separate cargo workspace; cache its target dir so repeat
      # builds don't recompile the whole dependency tree (rayon/regex/ssh2/memmap2).
      - name: Cache cargo build
        uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # Typecheck before invoking the bundler — `tauri build` runs `tsc` via
      # beforeBuildCommand, but failing here gives a clearer error and skips
      # the (slow) Rust compile when the frontend is broken.
      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'LogAnalyzer ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'Automated build. Download the installer for your platform below.'
          releaseDraft: false
          prerelease: false
