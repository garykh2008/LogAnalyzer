[package]
name = "loganalyzer"
# Version source of truth is ../package.json: tauri.conf.json points at it, and
# the Windows exe/bundle version is derived from there (verified — flipping
# package.json alone moves the generated resource.rc). This field is only cargo's
# own crate metadata; kept aligned so nothing reads as a stale version.
version = "3.3.0"
description = "A high-performance diagnostic log viewer with pattern matching and filtering"
authors = ["LogAnalyzer Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loganalyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.8"
regex = "1.10"
memmap2 = "0.9"
encoding_rs = "0.8"
rfd = "0.14"
glob = "0.3"
# `openssl-on-win32` switches libssh2 off the WinCNG backend. WinCNG cannot do
# ed25519/ECDSA in the vendored build (LIBSSH2_ECDSA_WINCNG is never defined), so
# curve25519/ECDH kex and every modern host key are missing; a stock Windows
# OpenSSH target then rejects the handshake with "Unable to exchange encryption
# keys" (-5, KEX_FAILURE). OpenSSL restores the full modern algorithm set.
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
base64 = "0.22"

